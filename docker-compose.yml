# Local emulators: everything runs without an Azure subscription.
#
#   docker compose up -d                                  # Azurite + legacy PHP API
#   ACCEPT_EULA=Y MSSQL_SA_PASSWORD='<strong password>' \
#     docker compose --profile servicebus up -d          # + Service Bus emulator (needs SQL Server)
#
# Setting ACCEPT_EULA=Y accepts the Service Bus emulator and SQL Server licence terms.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    # --skipApiVersionCheck: newer Azure.Storage SDKs may send an API version Azurite does not know yet.
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table

  legacy-php:
    image: php:8.3-cli
    working_dir: /app
    command: php -S 0.0.0.0:8080 legacy-php/public/index.php
    environment:
      ENABLE_TEST_ENDPOINTS: "true"
    volumes:
      - ./legacy-php:/app/legacy-php:ro
      - ./data:/app/data:ro
    ports:
      - "8080:8080"

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [servicebus]
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    profiles: [servicebus]
    depends_on:
      - mssql
    volumes:
      - ./infra/servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      SQL_WAIT_INTERVAL: "15"
    ports:
      - "5672:5672" # AMQP
      - "5300:5300" # management + health
